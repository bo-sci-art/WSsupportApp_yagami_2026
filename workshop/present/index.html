<!DOCTYPE html>
<html lang="ja" data-ruby="first">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>矢上小防災行動マップ</title>

  <!-- ▼ Leaflet（同梱・外部依存なし） -->
  <link rel="stylesheet" href="./leaflet.css">
  <link rel="stylesheet" href="./style.css?v=yagami6">
</head>
<body>

  <header id="global-header">
    <div class="header-left">
      <div class="header-logo-icon">🗺️</div>
      <div class="header-titles">
        <h1 class="header-main-title">矢上小{やがみしょう}防災{ぼうさい}行動{こうどう}マップ</h1>
      </div>
    </div>

    <div class="header-right">
      <div class="status-item">鑑賞済{かんしょうず}み <span id="view-count"></span></div>

      <button type="button" id="header-help-btn">？</button>
      <button type="button" id="back-to-top-btn" class="header-back-btn">
    ＜ 最初{さいしょ}に戻{もど}る
  </button>
    </div>
  </header>

  <div class="main-container">

    <div id="sidebar">

      <div id="sidebar-places">
        <div class="place-tabs" id="place-tabs"></div>
        <div class="art-search-row">
          <span class="art-search-icon">🔍</span>
          <input type="search" id="art-search" class="art-search" inputmode="search" autocomplete="off"
                 placeholder="番号（例 4201）かタイトルで探す" aria-label="番号かタイトルで探す">
        </div>
      </div>

      <div id="sidebar-filter">

        <div class="filter-main-header">
          <span>⚙️ 絞{しぼ}り込{こ}み</span>
          <span class="toggle-icon closed">﹀</span>
        </div>

        <div class="filter-content closed">
          <div class="filter-group">
            <div class="filter-label">災害{さいがい}の種類{しゅるい}</div>
            <div class="filter-chips">
              <button type="button" class="chip active" data-cat="all">すべて</button>
              <button type="button" class="chip" data-cat="mizu">水害{すいがい}</button>
              <button type="button" class="chip" data-cat="jiban">地盤{じばん}</button>
              <button type="button" class="chip" data-cat="jishin">地震{じしん}</button>
            </div>

            <button type="button" id="open-hazard-btn" class="hazard-overlay-btn">
               🗺️ ハザードマップを重{かさ}ねる
            </button>
          </div>

          <div class="filter-group">
            <div class="filter-label">いつの行動{こうどう}</div>
            <div class="filter-chips phase-chips">
              <button type="button" class="chip phase-chip active" data-phase="all">すべて</button>
              <button type="button" class="chip phase-chip" data-phase="prior">災害{さいがい}の前{まえ}</button>
              <button type="button" class="chip phase-chip" data-phase="during">災害{さいがい}のとき</button>
              <button type="button" class="chip phase-chip" data-phase="recovery">災害{さいがい}のあと</button>
            </div>
          </div>
        </div>
      </div>

      <div id="art-list-container">
        </div>

    </div> <div id="map-area">
      <div id="viewDiv"></div>

      <button type="button" id="search-area-btn" class="search-area-btn" style="display:none;">
        このエリアで再{さい}検索{けんさく}
      </button>

      <button type="button" id="menu-btn">
        <span style="font-size:1.2em;">≡</span> 防災{ぼうさい}情報{じょうほう}
      </button>

      <div id="bottom-left-controls">
        <div class="control-group">
          <div class="basemap-buttons-container">
            <button type="button" id="white-map-btn" class="basemap-btn active">白地図{しろちず}</button>
            <button type="button" id="satellite-btn" class="basemap-btn">衛星{えいせい}</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="control-panel" style="display:none;">
    <button type="button" id="close-panel-btn" class="close-btn">×</button>

    <div class="tab-buttons">
      <button type="button" id="hazard-tab" class="tab-button active">ハザードマップ</button>
    </div>

    <!-- ▼ ハザード：前回作成した国土地理院ベースの種類に差し替え -->
    <div id="hazard-content" class="tab-content">

      <div id="group-mizu" class="hazard-group">
        <div class="hazard-group-header">水害{すいがい}</div>
        <div class="hazard-group-content">
          <div class="filter-option">
            <span><input type="checkbox" id="haz-flood_l2"><label for="haz-flood_l2">洪水{こうずい}（外水氾濫{がいすいはんらん}）</label></span>
            <button type="button" class="haz-info" data-k="flood_l2">?</button>
          </div>
          <div class="filter-option">
            <span><input type="checkbox" id="haz-hightide"><label for="haz-hightide">高潮{たかしお}</label></span>
            <button type="button" class="haz-info" data-k="hightide">?</button>
          </div>
        </div>
      </div>

      <div id="group-jiban" class="hazard-group">
        <div class="hazard-group-header">地盤{じばん}</div>
        <div class="hazard-group-content">
          <div class="filter-option">
            <span><input type="checkbox" id="haz-kyukei"><label for="haz-kyukei">土砂{どしゃ}災害{さいがい}（急傾斜地{きゅうけいしゃち}の崩壊{ほうかい}）</label></span>
            <button type="button" class="haz-info" data-k="kyukei">?</button>
          </div>
        </div>
      </div>

      <div id="group-jishin" class="hazard-group">
        <div class="hazard-group-header">地震{じしん}</div>
        <div class="hazard-group-content">
          <a class="ext-link" href="https://wwwm.city.yokohama.lg.jp/yokohama/Map?mid=6&amp;mpx=139.62630111702703&amp;mpy=35.536158445033394&amp;mps=10000&amp;mtp=dm&amp;gprj=3" target="_blank" rel="noopener">
            🔗 横浜市{よこはまし}の「わいわい防災{ぼうさい}マップ」を見{み}る
            <small>震度{しんど}（地震{じしん}の揺{ゆ}れ）を確認{かくにん}できます（外部{がいぶ}サイト）</small>
          </a>
        </div>
      </div>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
      <div id="legend-container"></div>
    </div>

  </div>

  <!-- ▼ Leaflet 本体（同梱） -->
  <script src="./leaflet.js"></script>
  <script src="../common/config.js?v=yagami4"></script>
  <script src="../common/places.js?v=yagami4"></script>
  <script src="../common/ruby.js?v=yagami4"></script>
  <script src="./script.js?v=yagami7"></script>

  <div id="tutorial-overlay" class="tutorial-overlay" style="display: none;">
    <div class="tutorial-card">

      <div class="tutorial-image-container">
        <img id="tutorial-img" alt="マップの使い方の写真" class="tutorial-img">
      </div>

      <div class="tutorial-content">
        <h3 id="tutorial-title">タイトル</h3>
        <p id="tutorial-desc">説明文がここに入ります。</p>
      </div>

      <div class="tutorial-footer">
        <button type="button" id="skip-btn" class="tutorial-nav-btn secondary">とじる</button>
        <div class="tutorial-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <button type="button" id="next-btn" class="tutorial-nav-btn primary">つぎへ ＞</button>
      </div>

    </div>
  </div>
</body>
</html>
