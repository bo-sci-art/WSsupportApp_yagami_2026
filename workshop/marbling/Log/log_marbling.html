<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>マーブリングの記録</title>
    <link rel="stylesheet" href="log_marbling_styles.css?v=yagami3">
    <link rel="stylesheet" href="../../common/log-fit.css?v=yagami3">
    <link rel="stylesheet" href="../../common/kids.css?v=yagami3">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="step-indicator">2 マーブリング</div>
            <h1 class="page-title">マーブリングで表{あらわ}した災害{さいがい}リスクを書{か}こう</h1>
        </header>

        <main class="content">
            <section class="input-section">
                <h2 class="section-title">
                    どのような災害{さいがい}リスクを表{あらわ}しましたか？
                    <span class="required-badge">必須{ひっす}</span>
                </h2>
                <div class="hint-text">
                    <p>・模様{もよう}の形{かたち}や動{うご}きは、災害{さいがい}のどのような様子{ようす}を表{あらわ}していますか？</p>
                    <p>・それぞれの色{いろ}は、何{なに}を表{あらわ}していますか？</p>
                </div>
                <textarea
                    id="marblingDescription"
                    class="description-textarea"
                    rows="4"
                    placeholder="例）大雨で川があふれ、学校のまわりの低い土地に水が流れこむ様子を表しました。にごった水を茶色、深く水につかる場所をこい青のうずで表現しています。"
                    aria-label="マーブリングで表した災害リスク"
                    required
                ></textarea>
                <div class="validation-message" id="descriptionValidation" style="display: none;">
                    ⚠️ 入力{にゅうりょく}してから次{つぎ}へ進{すす}んでください
                </div>
                <div class="character-count" id="characterCount">
                    <span id="currentCount">0</span> 文字{もじ}
                </div>
            </section>
        </main>

        <footer class="page-footer">
            <button type="button" class="btn-secondary" id="backBtn">◀ マーブリングにもどる</button>
            <button type="button" class="btn-primary" id="nextBtn" disabled>つぎへ ▶</button>
        </footer>
    </div>
    <script src="../../common/ruby.js?v=yagami3"></script>
    <script src="log_marbling_script.js?v=yagami3"></script>
</body>
</html>
