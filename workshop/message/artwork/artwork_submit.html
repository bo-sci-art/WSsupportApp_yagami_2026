<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>タイトルとペンネーム</title>
    <link rel="stylesheet" href="./artwork_submit_styles.css?v=yagami2">
    <link rel="stylesheet" href="../../common/log-fit.css?v=yagami2">
    <link rel="stylesheet" href="../../common/kids.css?v=yagami2">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="step-indicator">4 メッセージ</div>
            <h1 class="page-title">作品{さくひん}のタイトルをつけよう</h1>
        </header>

        <main class="content">
            <section class="input-section">
                <h2 class="section-title">
                    作品{さくひん}のタイトル（メッセージ）
                    <span class="required-badge">必須{ひっす}</span>
                </h2>
                <input
                    type="text"
                    id="artworkTitle"
                    class="title-input"
                    placeholder="例）警報が出たら、早めに高い場所へ避難しよう"
                    aria-label="作品のタイトル"
                    required
                />
                <div class="validation-message" id="titleValidation" style="display: none;">
                    ⚠️ タイトルを入力{にゅうりょく}してください
                </div>
            </section>

            <section class="input-section">
                <h2 class="section-title">
                    ペンネーム
                    <span class="required-badge">必須{ひっす}</span>
                </h2>
                <input
                    type="text"
                    id="creatorName"
                    class="name-input"
                    placeholder="例）ぼうさいマン"
                    aria-label="ペンネーム"
                    required
                />
                <div class="validation-message" id="nameValidation" style="display: none;">
                    ⚠️ ペンネームを入力{にゅうりょく}してください
                </div>
            </section>
        </main>

        <footer class="page-footer">
            <button type="button" class="btn-secondary" id="backBtn">◀ もどる</button>
            <button type="button" class="btn-primary" id="nextBtn" disabled>たしかめる ▶</button>
        </footer>
    </div>
    <script src="../../common/ruby.js?v=yagami2"></script>
    <script src="./artwork_submit_script.js?v=yagami2"></script>
</body>
</html>
