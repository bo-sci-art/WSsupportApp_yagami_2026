<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>作品にする場所</title>
    <link rel="stylesheet" href="./log_hazard_map_styles.css?v=yagami4">
    <link rel="stylesheet" href="../../common/log-fit.css?v=yagami4">
    <link rel="stylesheet" href="../../common/kids.css?v=yagami4">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="step-indicator">1 ハザードマップ</div>
            <h1 class="page-title">作品{さくひん}にする場所{ばしょ}と災害{さいがい}を選{えら}ぼう</h1>
        </header>

        <main class="content">
            <section class="input-section">
                <h2 class="section-title">
                    ① 自分{じぶん}の担当{たんとう}の場所{ばしょ}
                    <span class="required-badge">必須{ひっす}</span>
                </h2>
                <p class="section-description">先生{せんせい}に言{い}われた場所{ばしょ}を1つ選{えら}んでください</p>
                <div class="place-buttons" id="placeButtons"></div>
                <div class="map-container place-map-container">
                    <div id="map" class="map"></div>
                </div>
                <div class="validation-message" id="locationValidation" style="display: none;">
                    ⚠️ 場所{ばしょ}を選{えら}んでください
                </div>
            </section>

            <section class="input-section">
                <h2 class="section-title">
                    ② 読{よ}み取{と}ったハザードマップ
                    <span class="required-badge">必須{ひっす}</span>
                </h2>
                <p class="section-description">使{つか}ったハザードマップをすべて選{えら}んでください（いくつでも選{えら}べます）</p>
                <div class="hazard-selection" id="hazardSelection"></div>
                <div class="validation-message" id="hazardValidation" style="display: none;">
                    ⚠️ 1つ以上{いじょう}選{えら}んでください
                </div>
            </section>
        </main>

        <footer class="page-footer">
            <button type="button" class="btn-secondary" id="backBtn">◀ もどる</button>
            <button type="button" class="btn-primary" id="nextBtn" disabled>つぎへ ▶</button>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../common/progress.js?v=yagami4"></script>
    <script src="../../common/places.js?v=yagami4"></script>
    <script src="../../common/ruby.js?v=yagami4"></script>
    <script src="./log_hazard_map_script.js?v=yagami4"></script>
</body>
</html>
