<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>作品にする場所</title>
    <link rel="stylesheet" href="./log_hazard_map_styles.css?v=yagami1">
    <link rel="stylesheet" href="../../common/log-fit.css?v=yagami1">
    <link rel="stylesheet" href="../../common/kids.css?v=yagami1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="step-indicator">1 ハザードマップ</div>
            <h1 class="page-title">作品{さくひん}にする 場所{ばしょ}と 災害{さいがい}を えらぼう</h1>
        </header>

        <main class="content">
            <section class="input-section">
                <h2 class="section-title">
                    ① 見{み}た ハザードマップ
                    <span class="required-badge">かならず</span>
                </h2>
                <p class="section-description">あてはまるものを ぜんぶ えらんでね</p>
                <div class="hazard-selection" id="hazardSelection"></div>
                <div class="validation-message" id="hazardValidation" style="display: none;">
                    ⚠️ 1つ いじょう えらんでね
                </div>
            </section>

            <section class="input-section">
                <h2 class="section-title">
                    ② 作品{さくひん}にする 場所{ばしょ}
                    <span class="required-badge">かならず</span>
                </h2>
                <p class="section-description">地図{ちず}を タッチして、「ここに する」を おしてね</p>
                <div class="map-container">
                    <div id="map" class="map"></div>
                    <div class="map-instruction" id="mapInstruction">📍 地図{ちず}を タッチしてね</div>
                </div>

                <div class="location-confirmation" id="locationConfirmation" style="display: none;">
                    <div class="location-info">
                        <p class="location-label">📍 ここで いいかな？</p>
                        <p class="location-coords" id="locationCoords" hidden></p>
                        <p class="location-status" id="locationStatus" hidden></p>
                    </div>
                    <button type="button" class="btn-confirm-location" id="confirmLocationBtn">ここに する</button>
                </div>

                <div class="location-confirmed" id="locationConfirmed" style="display: none;">
                    <div class="confirmed-badge">✓ 場所{ばしょ}が きまったよ</div>
                    <p class="confirmed-coords" id="confirmedCoords" hidden></p>
                    <button type="button" class="btn-change-location" id="changeLocationBtn">えらびなおす</button>
                </div>

                <div class="validation-message" id="locationValidation" style="display: none;">
                    ⚠️ 場所{ばしょ}を きめてね
                </div>
            </section>
        </main>

        <footer class="page-footer">
            <button type="button" class="btn-secondary" id="backBtn">◀ もどる</button>
            <button type="button" class="btn-primary" id="nextBtn" disabled>つぎへ ▶</button>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../common/ruby.js?v=yagami1"></script>
    <script src="./log_hazard_map_script.js?v=yagami1"></script>
</body>
</html>
