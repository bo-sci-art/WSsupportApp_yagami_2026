<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>防災アートをつくろう</title>
<style>
  :root { --green:#16a34a; --green-d:#15803d; --ink:#1f2937; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #dcfce7, #fff 45%, #bbf7d0);
    display: grid; place-items: center; padding: 16px;
  }
  ruby rt { font-size: .5em; }
  .card {
    width: min(760px, 100%); background: #fff; border-radius: 28px;
    padding: 40px 32px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.08);
  }
  .school { font-size: 1.3rem; font-weight: 700; color: #0e9f6e; margin: 0 0 8px; line-height: 2; }
  h1 { font-size: clamp(2rem, 5vw, 2.8rem); color: #166534; margin: 0 0 20px; line-height: 1.7; }
  .lead { font-size: 1.35rem; line-height: 2.2; margin: 0 0 32px; }
  .start {
    appearance: none; border: 0; background: var(--green); color: #fff; cursor: pointer;
    font-size: 1.8rem; font-weight: 800; padding: 18px 64px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(22,163,74,.35);
  }
  .start:active { background: var(--green-d); transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card">
    <p class="school"><ruby>矢上<rt>やがみ</rt></ruby><ruby>小学校<rt>しょうがっこう</rt></ruby> 4<ruby>年<rt>ねん</rt></ruby>2<ruby>組<rt>くみ</rt></ruby></p>
    <h1><ruby>防災<rt>ぼうさい</rt></ruby>アートをつくろう</h1>
    <p class="lead">
      <ruby>先生<rt>せんせい</rt></ruby>のお<ruby>話<rt>はなし</rt></ruby>をきいてから、<br>
      「はじめる」をおしてね。
    </p>
    <button class="start" id="startBtn" type="button">はじめる ▶</button>
  </main>

<script src="../common/config.js?v=yagami1"></script>
<script>
  // 「はじめる」を押したときだけ、前の人の作品データを消す（共有のiPadでも真っさらから始められるように）
  // ※ページを開いただけでは消さない（まちがえて開いても作品が消えないように）
  var NEXT_URL = "../map/app/index.html";
  var LS_KEYS = ["hazardMapLog","marblingLog","collageLog","artworkSubmit","artworkImage","artworkImageExt",
                 "pendingArtworkSubmitPayload","lastSubmittedArtworkId","lastColorHex","paletteName"];
  var IDB_KEYS = ["latest_marbling_base","collage_stamps","artwork_image"];

  function resetWorkshopSession() {
    try { LS_KEYS.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { console.warn(e); }
    return new Promise(function (resolve) {
      try {
        var req = indexedDB.open("ws_art_db", 1);
        req.onupgradeneeded = function () {
          if (!req.result.objectStoreNames.contains("images")) req.result.createObjectStore("images");
        };
        req.onsuccess = function () {
          try {
            var tx = req.result.transaction("images", "readwrite");
            IDB_KEYS.forEach(function (k) { tx.objectStore("images").delete(k); });
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { resolve(); };
          } catch (e) { resolve(); }
        };
        req.onerror = function () { resolve(); };
      } catch (e) { resolve(); }
      setTimeout(resolve, 1500);
    });
  }

  document.getElementById("startBtn").addEventListener("click", function () {
    this.disabled = true;
    resetWorkshopSession().then(function () { location.href = NEXT_URL; });
  });
</script>
</body>
</html>
